# MITRE ATT&CK technique -> Indian law (IT Act 2000 / BNS 2023) mapping.
# Researched 2026-11-26 from public sources. NOT reviewed by a lawyer.
# Every entry is only "suggested - officer confirms". Nothing here decides guilt.
# Doubts are kept per entry ("doubt") and globally ("global_doubts").

meta:
  schema_version: 1
  last_researched: "2026-11-26"
  review_status: "DRAFT - researched from public sources, not reviewed by a lawyer"
  status_text: "suggested - officer confirms"
  acts:
    "IT Act 2000":
      full_name: "The Information Technology Act, 2000 (Act 21 of 2000)"
      url: "https://www.indiacode.nic.in/handle/123456789/1999"
    "BNS 2023":
      full_name: "The Bharatiya Nyaya Sanhita, 2023 (Act 45 of 2023), in force 1 July 2024"
      url: "https://www.indiacode.nic.in/handle/123456789/20062"
    "BSA 2023":
      full_name: "The Bharatiya Sakshya Adhiniyam, 2023 (Act 47 of 2023), in force 1 July 2024"
      url: "https://www.indiacode.nic.in/handle/123456789/20063"
  research_sources:
    - "indiacode.nic.in act pages (BNS handle 20062, IT Act handle 1999, BSA handle 20063) - Act-level pages only"
    - "CIS India: text of IT Act section 43 (cis-india.org/internet-governance/resources/section-43-it-act.txt)"
    - "Secondary legal explainers for IT Act 66/66C/66D and BNS 308/318/319/336/351 (iPleaders, LexiAI, LawSikho, SCC Online blog, newspaper FIR reports)"
  global_doubts:
    - "Not reviewed by a lawyer. Which section applies depends on the facts and on the officer and prosecutor."
    - "Links go to the Act-level page on indiacode.nic.in because stable section-level deep links were not found. Check the section on that page."
    - "IT Act section 43 gives civil compensation. Criminal liability comes through section 66 and needs a dishonest or fraudulent intention."
    - "BNS sub-section numbers (308, 318(4), 319(2), 336(3), 351(2)) were taken from secondary sources, not read from the Gazette. Verify before use."
    - "Punishment terms are deliberately not listed: secondary sources disagree on some (e.g. 319(2))."
    - "BNS theft (s.303) is not suggested for data copying. Whether data counts as movable property under BNS is unclear; legal advice needed."
    - "IT Act 66F (cyber terrorism) and BNS organised-crime provisions are not suggested automatically. They need specific intent or scale that logs cannot show."
    - "The DPDP Act 2023 may also matter for personal-data breaches. It is outside the requested scope (IT Act / BNS)."

techniques:

  T1078:
    name: "Valid Accounts"
    entries:
      - offence: "Identity theft - fraudulent or dishonest use of another person's password or unique identification feature"
        act: "IT Act 2000"
        section: "66C"
        reason: "Logging in with another person's credentials (for example stolen credentials of the account holder) is the typical fact pattern for this section."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Does not fit if the account holder shared the credentials willingly. Confirm that the credentials were taken or misused."
      - offence: "Unauthorised access to a computer system"
        act: "IT Act 2000"
        section: "43(a)"
        reason: "Access to a computer, system or network without permission of the owner or person in charge."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Section 43 is civil compensation. Criminal side is section 66."
      - offence: "Computer related offence - section 43 act done dishonestly or fraudulently"
        act: "IT Act 2000"
        section: "66"
        reason: "Makes a section 43 act (here unauthorised access) a criminal offence when done dishonestly or fraudulently."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Needs proof of dishonest or fraudulent intention."

  T1021:
    name: "Remote Services"
    entries:
      - offence: "Unauthorised access to a computer system"
        act: "IT Act 2000"
        section: "43(a)"
        reason: "Remote login (for example SSH) to another server without permission is access to a computer system."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Remote services are used normally by administrators. Whether access was without permission depends on who the user really was. If the credentials were stolen, also see T1078 (66C)."
      - offence: "Computer related offence - section 43 act done dishonestly or fraudulently"
        act: "IT Act 2000"
        section: "66"
        reason: "Criminal form of section 43(a) when the access was dishonest or fraudulent."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Needs proof of intention."

  T1530:
    name: "Data from Cloud Storage"
    entries:
      - offence: "Downloading, copying or extracting data without permission"
        act: "IT Act 2000"
        section: "43(b)"
        reason: "Downloading or copying data from a computer system or network (here cloud storage) without permission of the person in charge."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Cloud logs show an object was read. They do not show what the person did with it afterwards."
      - offence: "Computer related offence - section 43 act done dishonestly or fraudulently"
        act: "IT Act 2000"
        section: "66"
        reason: "Criminal form of section 43(b) when the download was dishonest or fraudulent."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Needs proof of intention."

  T1110:
    name: "Brute Force"
    entries:
      - offence: "Unauthorised access to a computer system"
        act: "IT Act 2000"
        section: "43(a)"
        reason: "Applies when guessing passwords actually led to access (secured access) without permission."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Failed attempts alone may not meet 'accesses or secures access'. Whether an attempt provision helps for IT Act offences is a question for the legal officer."
      - offence: "Computer related offence - section 43 act done dishonestly or fraudulently"
        act: "IT Act 2000"
        section: "66"
        reason: "Criminal form of section 43(a) when done dishonestly or fraudulently."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Same doubt as 43(a) for failed attempts."

  T1566:
    name: "Phishing"
    entries:
      - offence: "Cheating by personation using a computer resource"
        act: "IT Act 2000"
        section: "66D"
        reason: "Pretending to be a trusted sender or site through email or web to deceive a person."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "A phishing email with no victim response may not complete the offence."
      - offence: "Cheating and dishonestly inducing delivery of property"
        act: "BNS 2023"
        section: "318(4)"
        reason: "If the victim was deceived into handing over money, property or something valuable."
        source_url: "https://www.indiacode.nic.in/handle/123456789/20062"
        doubt: "Needs delivery of property or valuable security. Stolen credentials alone may not fit; legal view needed."
      - offence: "Cheating by personation"
        act: "BNS 2023"
        section: "319(2)"
        reason: "Cheating by pretending to be another person (for example impersonating a bank or colleague)."
        source_url: "https://www.indiacode.nic.in/handle/123456789/20062"
        doubt: "Sub-section number from secondary sources."
      - offence: "Forgery for the purpose of cheating"
        act: "BNS 2023"
        section: "336(3)"
        reason: "If a fake website, email or electronic record was made in order to cheat."
        source_url: "https://www.indiacode.nic.in/handle/123456789/20062"
        doubt: "Only if a false electronic record was actually created. Logs of a received email do not show who made it."

  T1486:
    name: "Data Encrypted for Impact"
    entries:
      - offence: "Introducing malware, damaging data or disrupting a system"
        act: "IT Act 2000"
        section: "43(c), 43(d), 43(e)"
        reason: "Ransomware introduces a contaminant (c), alters or damages data (d) and disrupts the system (e)."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Which clause fits depends on the technical findings."
      - offence: "Computer related offence - section 43 act done dishonestly or fraudulently"
        act: "IT Act 2000"
        section: "66"
        reason: "Criminal form of the section 43 acts above."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Needs proof of intention."
      - offence: "Extortion"
        act: "BNS 2023"
        section: "308"
        reason: "If a ransom was demanded by putting the victim in fear and money or property was delivered."
        source_url: "https://www.indiacode.nic.in/handle/123456789/20062"
        doubt: "Correct sub-section depends on the threat and on whether anything was delivered. Officer to decide."
      - offence: "Criminal intimidation"
        act: "BNS 2023"
        section: "351(2)"
        reason: "If a threat (for example to leak or destroy data) was communicated to the victim."
        source_url: "https://www.indiacode.nic.in/handle/123456789/20062"
        doubt: "Needs the actual threat message as evidence."

  T1048:
    name: "Exfiltration Over Alternative Protocol"
    entries:
      - offence: "Downloading, copying or extracting data without permission"
        act: "IT Act 2000"
        section: "43(b)"
        reason: "Moving data out of a system over another protocol is extraction of data."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Network logs may show volume and destination but not file content."
      - offence: "Computer related offence - section 43 act done dishonestly or fraudulently"
        act: "IT Act 2000"
        section: "66"
        reason: "Criminal form of section 43(b) when done dishonestly or fraudulently."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Needs proof of intention."

  T1059:
    name: "Command and Scripting Interpreter"
    entries:
      - offence: "Unauthorised access to a computer system"
        act: "IT Act 2000"
        section: "43(a)"
        reason: "Only when the commands or scripts were run on a system without permission."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Running commands is normal admin activity. It is not unlawful by itself; context is essential."
      - offence: "Introducing a computer contaminant or virus"
        act: "IT Act 2000"
        section: "43(c)"
        reason: "Only when the script introduced malware or a contaminant."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Needs analysis of what the script did."
      - offence: "Computer related offence - section 43 act done dishonestly or fraudulently"
        act: "IT Act 2000"
        section: "66"
        reason: "Criminal form of the section 43 acts when done dishonestly or fraudulently."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Needs proof of intention."

  T1098:
    name: "Account Manipulation"
    entries:
      - offence: "Unauthorised access to a computer system"
        act: "IT Act 2000"
        section: "43(a)"
        reason: "Changing accounts, keys or permissions to keep access without permission."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Check whether the person had authority to change the account."
      - offence: "Destroying, deleting or altering information in a computer resource"
        act: "IT Act 2000"
        section: "43(i)"
        reason: "Altering account or permission data may count as altering information in a computer resource."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Arguable. Clause letter (i) taken from a reproduction of section 43; verify on indiacode."
      - offence: "Computer related offence - section 43 act done dishonestly or fraudulently"
        act: "IT Act 2000"
        section: "66"
        reason: "Criminal form of the section 43 acts when done dishonestly or fraudulently."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Needs proof of intention."

  T1005:
    name: "Data from Local System"
    entries:
      - offence: "Downloading, copying or extracting data without permission"
        act: "IT Act 2000"
        section: "43(b)"
        reason: "Copying data from a local computer or removable media without permission."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Logs show file access; copying needs further proof."
      - offence: "Computer related offence - section 43 act done dishonestly or fraudulently"
        act: "IT Act 2000"
        section: "66"
        reason: "Criminal form of section 43(b) when done dishonestly or fraudulently."
        source_url: "https://www.indiacode.nic.in/handle/123456789/1999"
        doubt: "Needs proof of intention."
